<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TriageAI — automatic classification and routing for support tickets." />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TriageAI</title>
    <script>
      // Runs before the stylesheet paints. Applying the stored theme here,
      // rather than in React, avoids a flash of the wrong theme on load.
      (function () {
        try {
          if (localStorage.getItem("triageai-theme") === "light") {
            document.documentElement.classList.remove("dark");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
