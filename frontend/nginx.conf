server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite fingerprints everything in /assets, so those files can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The feed is long-lived; the default 60s would cut idle dashboards off.
    proxy_read_timeout 1h;
  }

  # Client-side routes (/analytics, /submit) all resolve to the SPA shell,
  # which must never be cached or deploys would serve stale asset hashes.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
