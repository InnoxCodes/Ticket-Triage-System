name: docker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build-only, no push: this exists to catch a broken Dockerfile before
      # it reaches Railway/Vercel, not to publish an image anywhere.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
