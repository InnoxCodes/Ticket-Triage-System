[project]
name = "triageai-backend"
version = "1.0.0"
description = "TriageAI — FastAPI service that classifies and routes support tickets"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "app/ml/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008", # FastAPI's Depends() in defaults is the documented idiom
    "E501", # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Raised inside Starlette's TestClient, not our code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
addopts = "-q --strict-markers"
