[project]
name = "triageai-backend"
version = "1.0.0"
description = "TriageAI — FastAPI service that classifies and routes support tickets"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "SQLAlchemy==2.0.36",
    "aiosqlite==0.22.1",
    "greenlet==3.1.1",
    "scikit-learn==1.6.1",
    "numpy==2.2.6",
    "scipy==1.15.0",
    "joblib==1.4.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "app/ml/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008", # FastAPI's Depends() in defaults is the documented idiom
    "E501", # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Raised inside Starlette's TestClient, not our code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app", "ml", "scripts"]
omit = ["app/ml/artifacts/*"]

[tool.coverage.report]
# Defensive branches (a malformed stored hash, an unreachable pool exhaustion
# guard) are excluded on purpose — they exist for safety, not to be exercised.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
